name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-latest}
          - {goos: linux, goarch: arm64, runner: ubuntu-latest}
          - {goos: darwin, goarch: arm64, runner: ubuntu-latest}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/krunlet-${GOOS}-${GOARCH}" ./cmd/krunlet
      - uses: actions/upload-artifact@v4
        with:
          name: krunlet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  publish:
    needs: build
    # Release is blocked on the same real VM smoke + stress as the PR gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: krunlet-*
          path: dist
          merge-multiple: true
      - name: Verify required real-VM status on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '.check_runs[] | select(.name == "vm-integration" and .conclusion == "success") | .id')
          test -n "$checks" || { echo "Refusing release: vm-integration missing/failed"; exit 1; }
      - name: Changelog and native dependency notice
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo '## Changes'
            if [ -n "$previous" ]; then
              git log "$previous..HEAD" --pretty='- %s (%h)'
            else
              git log HEAD --pretty='- %s (%h)'
            fi
            echo
            echo '## Native runtime requirements'
            echo '- libkrun **1.19.6** (upstream tag v1.19.6, commit 227b2de6ed323fe180e02f871c5f325a90c13cc2) (NOT libkrun 2.x).'
            echo '- libkrunfw required unless a custom trusted kernel is selected.'
            echo '- For gVisor virtio-net or yuhaiin ingress: build libkrun with **NET=1**.'
            echo '- Verify the host using `krunlet doctor --rootfs /trusted/rootfs` and check the `native.symbols` JSON.'
            echo '- Experimental: end-to-end KVM/HVF security isolation has not been certified.'
          } > release-notes.md
          sha256sum dist/* > checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* checksums.txt --notes-file release-notes.md --verify-tag
