name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  native-gate:
    runs-on: [self-hosted, linux, kvm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pin native ABI and mandatory KVM tests
        run: |
          test -r /dev/kvm
          test "$(pkg-config --modversion libkrun)" = "1.19.6"
          test -d "${KRUNLET_TEST_ROOTFS:?missing trusted test rootfs}"
          test -d "${KRUNLET_CGROUP_PARENT:?missing delegated cgroup v2 parent}"
          CGO_ENABLED=0 go test -tags vm_integration -timeout 20m ./...
  build:
    needs: native-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-latest}
          - {goos: linux, goarch: arm64, runner: ubuntu-latest}
          - {goos: darwin, goarch: arm64, runner: ubuntu-latest}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/krunlet-${GOOS}-${GOARCH}" ./cmd/krunlet
      - uses: actions/upload-artifact@v4
        with:
          name: krunlet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: krunlet-*
          path: dist
          merge-multiple: true
      - name: Changelog and native dependency notice
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo '## Changes'
            if [ -n "$previous" ]; then
              git log "$previous..HEAD" --pretty='- %s (%h)'
            else
              git log HEAD --pretty='- %s (%h)'
            fi
            echo
            echo '## Native runtime requirements'
            echo '- Required native libkrun **v1.19.6** (NOT libkrun 2.x). Verified against this exact version by native-gate.'
            echo '- libkrunfw required unless a custom trusted kernel is selected.'
            echo '- For gVisor virtio-net or yuhaiin ingress: build libkrun with **NET=1**.'
            echo '- Verify the host using `krunlet doctor --rootfs /trusted/rootfs` and check the `native.symbols` JSON.'
            echo '- Experimental: end-to-end KVM/HVF security isolation has not been certified.'
          } > release-notes.md
          sha256sum dist/* > checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* checksums.txt --notes-file release-notes.md --verify-tag
