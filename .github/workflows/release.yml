name: Prebuilt Release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Go']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prebuilt-release-${{ github.event_name == 'workflow_run' && 'main' || github.event_name == 'push' && github.ref_name || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-24.04}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check installer syntax
        shell: bash
        run: bash -n install.sh
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y git make pkg-config clang lld patchelf \
            build-essential libc6-dev libelf-dev libssl-dev libclang-dev llvm-dev
          # Use the same pinned firmware family as real vm-integration.
          # Older runner package indexes may not offer firmware ABI 5 yet.
          if apt-cache madison libkrunfw5 | awk '{print $3}' | grep -Fxq '5.5.0+ds-1'; then
            sudo apt-get install -y libkrunfw5=5.5.0+ds-1 libkrunfw-dev=5.5.0+ds-1
          else
            arch="$(dpkg --print-architecture)"
            url='https://mirrors.edge.kernel.org/ubuntu/pool/universe/libk/libkrunfw'
            curl -fL --retry 3 "$url/libkrunfw5_5.5.0+ds-1_${arch}.deb" -o "$RUNNER_TEMP/libkrunfw5.deb"
            curl -fL --retry 3 "$url/libkrunfw-dev_5.5.0+ds-1_${arch}.deb" -o "$RUNNER_TEMP/libkrunfw-dev.deb"
            sudo apt-get install -y "$RUNNER_TEMP/libkrunfw5.deb" "$RUNNER_TEMP/libkrunfw-dev.deb"
          fi
          sudo ldconfig
          # Ubuntu's libkrunfw-dev installs ABI 5 headers and symlinks but
          # may omit libkrunfw.pc. Emit metadata from the pinned installed
          # library path instead of relying on whatever is on the host.
          if ! pkg-config --exists libkrunfw; then
            fw="$(ldconfig -p | awk '$1=="libkrunfw.so.5" {print $NF; exit}')"
            test -n "$fw"
            printf 'prefix=/usr\nlibdir=%s\nincludedir=/usr/include\nName: libkrunfw\nDescription: Guest kernel library\nVersion: 5.5.0\nLibs: -L${libdir} -lkrunfw\nCflags: -I${includedir}\n' "$(dirname "$fw")" > "$RUNNER_TEMP/libkrunfw.pc"
            export PKG_CONFIG_PATH="$RUNNER_TEMP:${PKG_CONFIG_PATH:-}"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          fi
          test "$(pkg-config --modversion libkrunfw)" = 5.5.0
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew tap libkrun/krun
          brew trust libkrun/krun
          brew install libkrunfw lld llvm xz
          test "$(brew list --versions libkrunfw | awk '{print $2}')" = "5.6.2"
          test -f "$(brew --prefix libkrunfw)/lib/libkrunfw.dylib"
          test -f "$(brew --prefix llvm)/lib/libclang.dylib"
      - name: Build pinned libkrun with NET=1 and stage relocatable bundle
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.19.6 https://github.com/libkrun/libkrun.git "$RUNNER_TEMP/libkrun"
          test "$(git -C "$RUNNER_TEMP/libkrun" rev-parse HEAD)" = "227b2de6ed323fe180e02f871c5f325a90c13cc2"
          stage="$GITHUB_WORKSPACE/internal/nativebundle/assets"
          if [ "$GOOS" = linux ]; then
            make -C "$RUNNER_TEMP/libkrun" NET=1 -j2
            sudo make -C "$RUNNER_TEMP/libkrun" NET=1 install
            echo /usr/local/lib64 | sudo tee /etc/ld.so.conf.d/krunlet-ci-libkrun.conf >/dev/null
            sudo ldconfig
            lib="$(ldconfig -p | awk '$1=="libkrun.so.1" {print $NF; exit}')"
            fw="$(ldconfig -p | awk '$1=="libkrunfw.so.5" {print $NF; exit}')"
            test -n "$lib" && test -n "$fw"
            cp -L "$lib" "$stage/libkrun.so.1"
            cp -L "$fw" "$stage/libkrunfw.so.5"
            patchelf --set-rpath '$ORIGIN' "$stage/libkrun.so.1"
            readelf -d "$stage/libkrun.so.1" | grep -F '$ORIGIN'
            # libkrun 1.19.6 uses runtime dlopen, not DT_NEEDED, for firmware.
            strings "$stage/libkrun.so.1" | grep -Fx libkrunfw.so.5
            nm -D "$stage/libkrun.so.1" | grep -F 'krun_add_net_unixstream'
            ldd "$stage/libkrun.so.1" | tee "$RUNNER_TEMP/native-ldd.txt"
            ! grep -q 'not found' "$RUNNER_TEMP/native-ldd.txt"
          else
            llvm_lib="$(brew --prefix llvm)/lib"
            # bindgen's build-script executable dynamically loads libclang;
            # Xcode's clang executable alone does not make the dylib visible
            # to dyld on GitHub-hosted ARM64 runners.
            export LIBCLANG_PATH="$llvm_lib"
            # Do not put the full Homebrew LLVM lib directory in dyld's
            # global search path. It contains libLLVM.*.dylib, which can
            # override rustc's bundled LLVM and crash rustc at startup.
            clang_shim="$RUNNER_TEMP/krunlet-clang-dyld"
            mkdir -p "$clang_shim"
            ln -s "$llvm_lib/libclang.dylib" "$clang_shim/libclang.dylib"
            export DYLD_LIBRARY_PATH="$clang_shim:${DYLD_LIBRARY_PATH:-}"
            export PKG_CONFIG_PATH="$(brew --prefix libkrunfw)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            test -f "$LIBCLANG_PATH/libclang.dylib"
            rustc -vV # fail immediately if dyld is loading an incompatible LLVM
            make -C "$RUNNER_TEMP/libkrun" NET=1 -j2
            lib="$RUNNER_TEMP/libkrun/target/release/libkrun.1.19.6.dylib"
            fw="$(brew --prefix libkrunfw)/lib/libkrunfw.5.dylib"
            test -n "$lib" && test -f "$lib" && test -f "$fw"
            cp -L "$lib" "$stage/libkrun.dylib"
            cp -L "$fw" "$stage/libkrunfw.5.dylib"
            # A signed single-file CLI must load firmware relative to its
            # extracted libkrun, not a machine-specific Homebrew prefix.
            install_name_tool -id @loader_path/libkrun.dylib "$stage/libkrun.dylib"
            install_name_tool -id @loader_path/libkrunfw.5.dylib "$stage/libkrunfw.5.dylib"
            while read -r dep; do
              [ -n "$dep" ] || continue
              install_name_tool -change "$dep" @loader_path/libkrunfw.5.dylib "$stage/libkrun.dylib"
            done < <(otool -L "$stage/libkrun.dylib" | awk 'NR>1 {print $1}' | grep libkrunfw || true)
            otool -L "$stage/libkrun.dylib"
            codesign --force --sign - "$stage/libkrunfw.5.dylib"
            codesign --force --sign - "$stage/libkrun.dylib"
            codesign --verify --strict "$stage/libkrunfw.5.dylib"
            codesign --verify --strict "$stage/libkrun.dylib"
          fi
          test -s "$stage/libkrun."* 
          test -s "$stage/libkrunfw."*
          # This manifest fingerprints the *staged bytes*, not a system lib.
          STAGE="$stage" GOOS="$GOOS" python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          stage = pathlib.Path(os.environ["STAGE"])
          linux = os.environ["GOOS"] == "linux"
          lib = stage / ("libkrun.so.1" if linux else "libkrun.dylib")
          fw = stage / ("libkrunfw.so.5" if linux else "libkrunfw.5.dylib")
          baseline = ""
          if linux:
              versions = re.findall(r"GLIBC_(\d+\.\d+)", subprocess.check_output(["readelf", "-V", str(lib)], text=True))
              if versions:
                  baseline = max(versions, key=lambda x: tuple(map(int, x.split("."))))
          version = "5.5.0+ds-1" if linux else "5.6.2"
          fw_tag = "v5.5.0" if linux else "v5.6.2"
          kernel = "linux-6.12.91" if linux else "linux-6.12.109"
          data = {
              "libkrun_version": "1.19.6",
              "libkrun_commit": "227b2de6ed323fe180e02f871c5f325a90c13cc2",
              "firmware_version": version,
              "firmware_abi": 5,
              "glibc_baseline": baseline,
              "libkrun_sha256": hashlib.sha256(lib.read_bytes()).hexdigest(),
              "libkrunfw_sha256": hashlib.sha256(fw.read_bytes()).hexdigest(),
              "libkrun_source": "https://github.com/libkrun/libkrun/tree/v1.19.6",
              "libkrunfw_source": "https://github.com/libkrun/libkrunfw/tree/" + fw_tag,
              "kernel_source": "https://cdn.kernel.org/pub/linux/kernel/v6.x/" + kernel + ".tar.xz",
              "patches_source": "https://github.com/libkrun/libkrunfw/tree/" + fw_tag + "/patches",
          }
          (stage / "manifest.json").write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          print(json.dumps(data, sort_keys=True))
          PY
      - name: Build single-file CLI with embedded native runtime
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          RELEASE_EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = push ]; then
            version="$REF_NAME"
          elif [ "$RELEASE_EVENT" = workflow_run ]; then
            version="main-${RELEASE_SHA:0:12}"
          else
            version="pr-${RELEASE_SHA:0:12}"
          fi
          mkdir -p dist
          target="dist/krunlet-$GOOS-$GOARCH"
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" -o "$target" ./cmd/krunlet
          go build -tags nokrunlet_embed -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$version" -o "dist/slim-$GOOS-$GOARCH" ./cmd/krunlet
          printf 'embedded=%s\\nslim=%s\\n' "$(wc -c < "$target")" "$(wc -c < "dist/slim-$GOOS-$GOARCH")" > "dist/size-$GOOS-$GOARCH.txt"
          test -s "$target"
          test "$("./$target" version)" = "krunlet $version"
          if [ "$GOOS" = darwin ]; then
            codesign --force --sign - --entitlements docs/krunlet.entitlements "$target"
            codesign --verify --strict "$target"
          fi
          cp internal/nativebundle/assets/manifest.json "dist/native-manifest-$GOOS-$GOARCH.json"
          go test ./internal/nativebundle
          # Release artifact MUST resolve its embedded library without
          # requiring a system libkrun installation.
          "$target" doctor > dist/doctor.json
          grep -q 'krunlet/native/' dist/doctor.json
          grep -q '"VirtioNET":true' dist/doctor.json
          grep -q '"FirmwareLoadable":true' dist/doctor.json
          if [ "$GOOS" = darwin ]; then
            cachelib="$(python3 -c 'import json; print(json.load(open("dist/doctor.json"))["native_bundle"]["firmware"])')"
            test -f "$cachelib"
            codesign --verify --strict "$cachelib"
            codesign --verify --strict "$(dirname "$cachelib")/libkrun.dylib"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: krunlet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/krunlet-*
            dist/native-manifest-*
            dist/size-*
          if-no-files-found: error
          retention-days: 14


  vm-embedded-smoke:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: krunlet-linux-amd64
          path: dist
      - name: Prove VM runs with embedded libraries in a clean runtime
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo "::error::KVM is mandatory for clean embedded smoke"; exit 1; }
          chmod +x dist/krunlet-linux-amd64
          sudo apt-get update -y
          sudo apt-get install -y busybox-static
          guest="$RUNNER_TEMP/guest-rootfs"
          mkdir -p "$guest/bin" "$guest/tmp"
          chmod 1777 "$guest/tmp"
          cp "$(command -v busybox)" "$guest/bin/busybox"
          ln -s busybox "$guest/bin/true"
          mkdir -p "$RUNNER_TEMP/clean-cache" "$RUNNER_TEMP/fake-cache" "$RUNNER_TEMP/fake-host" "$RUNNER_TEMP/proof"
          printf 'incorrect-native-library\n' > "$RUNNER_TEMP/fake-host/libkrun.so.1"
          printf 'incorrect-firmware\n' > "$RUNNER_TEMP/fake-host/libkrunfw.so.5"
          # ubuntu:24.04 does not contain a libkrun/libkrunfw package.
          # Install only other dynamically-linked host runtime prerequisites.
          for mode in clean fake; do
            if [ "$mode" = clean ]; then
              cache="$RUNNER_TEMP/clean-cache"
              fake_env=
            else
              cache="$RUNNER_TEMP/fake-cache"
              fake_env="-e LD_LIBRARY_PATH=/fake-host"
            fi
            sudo docker run --rm --privileged --device=/dev/kvm \
              --mount "type=bind,src=$PWD/dist/krunlet-linux-amd64,dst=/usr/local/bin/krunlet,readonly" \
              --mount "type=bind,src=$guest,dst=/guest,readonly" \
              --mount "type=bind,src=$cache,dst=/cache" \
              --mount "type=bind,src=$RUNNER_TEMP/fake-host,dst=/fake-host,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/proof,dst=/proof" \
              -e XDG_CACHE_HOME=/cache $fake_env ubuntu:24.04 \
              /bin/bash -c "set -euo pipefail;
                if ldconfig -p | grep -E 'libkrun(fw)?[.]'; then echo 'unexpected system libkrun installed'; exit 1; fi;
                apt-get update -qq >/dev/null;
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libssl3t64 libelf1t64 libzstd1 liblzma5 >/dev/null;
                /usr/local/bin/krunlet doctor --rootfs /guest > /proof/$mode.json"
          done
          # Cache belongs to root inside the privileged container and is 0700.
          # Inspecting the bind mount as the unprivileged runner would report
          # is_file() == false even though the VM loaded the protected file.
          sudo --preserve-env=RUNNER_TEMP python3 - <<'PY'
          import hashlib, json, os, pathlib
          for mode in ("clean", "fake"):
              report=json.load(open(os.environ["RUNNER_TEMP"]+"/proof/"+mode+".json"))
              info=report["native_bundle"]
              assert info["source"]=="embedded", info
              assert info["integrity"], info
              lib=pathlib.Path(info["library"])
              fw=pathlib.Path(info["firmware"])
              assert lib.is_absolute() and fw.is_absolute()
              assert str(lib).startswith("/cache/krunlet/native/"), lib
              assert lib.name=="libkrun.so.1" and fw.name=="libkrunfw.so.5", info
              assert info["firmware_abi"]==5, info
              assert report["smoke_attempted"] and report["smoke_exit_code"]==0, report
              host_cache=pathlib.Path(os.environ["RUNNER_TEMP"]+("/clean-cache" if mode=="clean" else "/fake-cache"))
              for name,key in ((lib.name,"library_sha256"),(fw.name,"firmware_sha256")):
                  actual=host_cache / lib.relative_to("/cache/") .parent / name
                  assert actual.is_file(), actual
                  assert hashlib.sha256(actual.read_bytes()).hexdigest()==info[key], (actual,info[key])
          print("Embedded native pair booted in clean and fake-host KVM containers; absolute paths and hashes match")
          PY

  publish:
    if: github.event_name != 'pull_request'
    needs: [build, vm-embedded-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          pattern: krunlet-*
          path: dist
          merge-multiple: true
      - name: Verify real VM check and current rolling commit
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = workflow_run ]; then
            head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [ "$head" != "$RELEASE_SHA" ]; then
              echo "Stale main build $RELEASE_SHA; current main is $head"
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "vm-integration" and .status == "completed" and .conclusion == "success")] | length')"
          if [ "$result" -lt 1 ]; then
            echo "::error::Cannot publish $RELEASE_SHA: real vm-integration is missing or failed"
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Assemble binaries, install script, checksums and changelog
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          test -f dist/krunlet-linux-amd64
          test -f dist/krunlet-linux-arm64
          test -f dist/krunlet-darwin-arm64
          mkdir -p release
          cp dist/krunlet-* release/
          cp dist/native-manifest-* release/
          cp dist/size-*.txt release/
          cp install.sh release/install.sh
          cp cmd/krunlet/legal/Apache-2.0.txt release/
          cp cmd/krunlet/legal/LGPL-2.1-only.txt release/
          cp cmd/krunlet/legal/GPL-2.0-only.txt release/
          cp cmd/krunlet/legal/SOURCES.md release/NATIVE-SOURCES.md
          (cd release && sha256sum krunlet-* native-manifest-* install.sh Apache-2.0.txt LGPL-2.1-only.txt GPL-2.0-only.txt size-*.txt NATIVE-SOURCES.md | sort -k2) > release/checksums.txt

          {
            echo "## Changes"
            if [ "$RELEASE_EVENT" = workflow_run ]; then
              git log -20 --pretty='- %s (%h)' "$RELEASE_SHA"
            else
              previous="$(git describe --tags --match 'v*' --abbrev=0 "$RELEASE_SHA^" 2>/dev/null || true)"
              if [ -n "$previous" ]; then
                git log --pretty='- %s (%h)' "$previous..$RELEASE_SHA"
              else
                git log -20 --pretty='- %s (%h)' "$RELEASE_SHA"
              fi
            fi
            echo
            echo "## Prebuilt CLI"
            echo '- Linux amd64 / arm64, macOS Apple Silicon arm64.'
            echo '- Native libkrun 1.19.6 (NET=1) and libkrunfw are embedded in each CGO-free CLI; no system libkrun installation is needed.'
            echo '- Runtime ABI: libkrun **1.19.6**, upstream v1.19.6 commit 227b2de6ed323fe180e02f871c5f325a90c13cc2.'
            echo '- The CLI extracts checked native libraries into a private content-hashed user cache on first use. A trusted Linux guest rootfs is still required.'
            echo '- Included libkrun is compiled with NET=1 for gVisor Netstack and yuhaiin inbound.'
            echo '- Check virtualization/host dependencies: krunlet doctor --rootfs /trusted/rootfs.'
            echo '- Linux system libc and other external native transitive dependencies remain platform-dependent; macOS assets are ad-hoc signed (not notarized).'
            echo '- libkrun: Apache-2.0 (https://github.com/libkrun/libkrun/tree/v1.19.6); firmware: GPL-2.0/LGPL-2.1 (https://github.com/libkrun/libkrunfw). Redistributors must satisfy the corresponding-source obligations.'
            echo '- Native libkrun and firmware SHA-256, pinned sources and patched kernel are listed in each native-manifest-OS-ARCH.json asset.'
            echo '- Embedded vs. slim CLI byte sizes are reported per platform in size-OS-ARCH.txt.'
            for manifest in release/native-manifest-*.json; do
              echo "- $(basename "$manifest")"
              cat "$manifest"
            done
            echo '- Verify the release signature (checksums.sig) using the pinned public key before checking SHA-256.'
            echo '- Security isolation is experimental and depends on host-level virtualization, process and service cgroups.'
          } > release-notes.md

      - name: Sign checksum manifest (pinned public key)
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.KRUNLET_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::KRUNLET_RELEASE_SIGNING_KEY secret is required; do not publish unsigned releases"
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-private.pem"
          trap 'rm -f "$RUNNER_TEMP/release-private.pem"' EXIT
          openssl pkey -in "$RUNNER_TEMP/release-private.pem" -pubout -out "$RUNNER_TEMP/release-public.pem"
          cmp docs/release-signing-public.pem "$RUNNER_TEMP/release-public.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/release-private.pem" -out release/checksums.sig release/checksums.txt
          openssl dgst -sha256 -verify docs/release-signing-public.pem -signature release/checksums.sig release/checksums.txt

      - name: Update rolling main tag
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'workflow_run'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f main "$RELEASE_SHA"
          git push origin refs/tags/main --force

      - name: Publish prebuilt binaries and checksums
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = workflow_run ]; then
            if gh release view main >/dev/null 2>&1; then
              gh release edit main --prerelease --latest=false --notes-file release-notes.md
              gh release upload main release/* --clobber
            else
              gh release create main release/* --target "$RELEASE_SHA" \
                --prerelease --latest=false --notes-file release-notes.md
            fi
          else
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
              gh release upload "$GITHUB_REF_NAME" release/* --clobber
            else
              gh release create "$GITHUB_REF_NAME" release/* --verify-tag --notes-file release-notes.md
            fi
          fi
