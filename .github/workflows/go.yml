name: Go
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch dependencies
        run: go mod download
      - name: Format check
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "Files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Test without CGO
        run: CGO_ENABLED=0 go test ./...
      - name: Vet
        run: go vet ./...
